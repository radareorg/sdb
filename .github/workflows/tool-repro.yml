name: Windows tool reproduction
on:
  pull_request:
jobs:
  full-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9
        with:
          arch: x64
      - run: pip install meson ninja
      - run: git clone --depth 1 https://github.com/radareorg/radare2.git r2
      - name: Use this Sdb checkout
        shell: python
        run: |
          import shutil
          shutil.copytree('.', 'r2/subprojects/sdb', ignore=shutil.ignore_patterns('.git', 'r2', 'build'))
      - name: Enable crash dumps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dumps
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force
          New-ItemProperty -Path $key -Name DumpFolder -Value "$PWD\dumps" -PropertyType ExpandString -Force
          New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force
      - run: meson setup r2/build r2 --buildtype=release -Dc_std=c11 -Dc_args=/Zi -Dc_link_args=/DEBUG
      - run: meson compile -C r2/build -j4
      - name: Application crash events
        if: always()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=(Get-Date).AddHours(-1)} -ErrorAction SilentlyContinue | Format-List TimeCreated,Message
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-crash-diagnostics
          path: |
            dumps/
            r2/build/subprojects/sdb/*.pdb
            r2/build/meson-logs/
